[project]
name = "python-experiments"
version = "0.1.0"
description = "Python experiments project for blog-posts for codz.uz"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "roboticstoolbox-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_arm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[project.scripts]
make-figures = "robot_arm.make_figures:main"
